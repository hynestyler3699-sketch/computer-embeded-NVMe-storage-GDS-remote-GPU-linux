name: CI Build

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake
    
    - name: Configure & Build
      run: |
        mkdir -p build
        cd build
        cmake ..
        cmake --build . -- -j$(nproc)
    
    - name: Run tests
      run: |
        cd build || exit 0
        if [ -f CTestTestfile.cmake ]; then ctest --output-on-failure || true; fi
